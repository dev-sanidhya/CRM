# Sends the CRM update to the founders on Telegram at 7:00 pm IST every day (Sunday: a short look-ahead).
# Backup sender: the bot on Render sends at 19:00 IST. This runs at about 19:10 IST and sends only
# if today's update has not gone out (the "sent today" check is atomic, so never twice).
name: Daily CRM update

on:
  schedule:
    - cron: "40 13 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if today's update already went out"
        type: boolean
        default: false

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Send the update
        run: node scripts/digest.js ${{ inputs.force && '--force' || '' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_DB_PASSWORD: ${{ secrets.BOT_DB_PASSWORD }}
          BOT_FOUNDERS: ${{ secrets.BOT_FOUNDERS }}
