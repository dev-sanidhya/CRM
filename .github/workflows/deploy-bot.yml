# Redeploys the Telegram bot on Render whenever its code changes on main.
# (Render is linked to this public repo by URL, so it does not auto-deploy on push.)
name: Deploy bot to Render

on:
  push:
    branches: [main]
    paths: ["bot/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/srv-dbv1f23rjlhs73ajeuf0/deploys" \
            -d '{"clearCache":"do_not_clear"}' > /dev/null
          echo "Render deploy started"
